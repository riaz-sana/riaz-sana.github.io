<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Image · Sana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* This file renders the social-share preview card at 1200×630.
     To produce og-image.png:
       1. Open this file in Chrome
       2. Open DevTools → device toolbar (Cmd-Shift-M)
       3. Set viewport to 1200×630 exactly
       4. DevTools menu (⋮) → Capture full size screenshot
       5. Save as og-image.png next to your index.html
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #050717; }
  body { display: flex; align-items: flex-start; justify-content: flex-start; min-height: 100vh; }

  .card {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 60% 40% at 12% 18%, rgba(200, 165, 255, 0.18) 0%, transparent 55%),
      radial-gradient(ellipse 55% 60% at 90% 78%, rgba(255, 184, 163, 0.14) 0%, transparent 50%),
      radial-gradient(ellipse 45% 35% at 50% 50%, rgba(143, 223, 212, 0.10) 0%, transparent 60%),
      radial-gradient(ellipse 55% 45% at 75% 12%, rgba(168, 237, 221, 0.08) 0%, transparent 55%),
      linear-gradient(180deg, #07091c 0%, #0a0d28 50%, #050717 100%);
    color: #ece9f5;
  }

  /* The full SVG layer (background stars + constellation) */
  .svg-layer { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Text overlay — left half */
  .content {
    position: absolute;
    left: 60px;
    top: 56px;
    width: 480px;
    height: calc(100% - 112px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
  }

  .top {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .pulse {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ffb8a3;
    box-shadow: 0 0 12px #ffb8a3;
  }
  .brand {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 24px;
    color: #ece9f5;
    letter-spacing: -0.01em;
  }
  .brand em { color: #ffb8a3; font-style: normal; }

  .middle { padding-top: 8px; }

  .pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.32em;
    color: #ffb8a3;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .name {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 64px;
    line-height: 1.0;
    letter-spacing: -0.025em;
    color: #ece9f5;
    margin-bottom: 14px;
  }

  .role {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(236, 233, 245, 0.55);
    margin-bottom: 28px;
  }

  .tagline {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 22px;
    color: rgba(236, 233, 245, 0.78);
    line-height: 1.4;
    padding: 14px 0;
    max-width: 460px;
  }

  .footer {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .pseudo-btn {
    display: inline-flex;
    align-items: center;
    padding: 9px 16px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 600;
    white-space: nowrap;
  }
  .pseudo-btn.primary {
    background: #ffb8a3;
    color: #07091c;
  }
  .pseudo-btn.ghost {
    background: transparent;
    border: 1px solid rgba(236, 233, 245, 0.25);
    color: #ece9f5;
  }

  .url-mark {
    position: absolute;
    top: 56px;
    right: 60px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: rgba(236, 233, 245, 0.5);
    text-transform: lowercase;
    text-align: right;
    z-index: 2;
  }
  .url-mark .at { color: rgba(236, 233, 245, 0.3); margin-right: 6px; letter-spacing: 0.3em; }

  .system-mark {
    position: absolute;
    bottom: 56px;
    right: 60px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(236, 233, 245, 0.4);
    text-transform: lowercase;
    text-align: right;
    line-height: 1.6;
    z-index: 2;
  }
  .system-mark .acc { color: #ffb8a3; }
  .system-mark .v { color: rgba(236, 233, 245, 0.55); margin-left: 4px; }
</style>
</head>
